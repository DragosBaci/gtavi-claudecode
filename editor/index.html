<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Editor</title>
<style>
@font-face{font-family:"Montserrat";font-weight:900;src:url(/fonts/Montserrat-Black.ttf) format("truetype")}
@font-face{font-family:"Montserrat";font-weight:800;src:url(/fonts/Montserrat-ExtraBold.ttf) format("truetype")}
:root{
  --bg:#0c0d10;--bg2:#111216;--panel:#17181d;--panel2:#1d1f25;--line:#2a2c34;--line2:#363946;
  --text:#eef0f4;--mute:#8d919c;--dim:#5d616c;--accent:#c8f03c;--accent-ink:#1a1f05;--accent-soft:rgba(200,240,60,.14);
  --yellow:#ffe14a;--red:#ff5d6c;--red-soft:rgba(255,93,108,.22);--green:#3ddc97;--green-soft:rgba(61,220,151,.18);
  --blue:#6f9bff;--blue-soft:rgba(111,155,255,.25);--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-rows:56px 1fr 214px;height:100vh}
/* header */
header{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.logo{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block;box-shadow:0 0 18px rgba(200,240,60,.35)}
select.clip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:360px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);white-space:nowrap}
.chip b{font-weight:600}
.chip.warn{border-color:#8a6a16;color:#ffd36b}
.chip.ok{border-color:#3e5a12;color:var(--accent)}
.grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:7px 13px;white-space:nowrap}
.btn:hover{border-color:#4a4e5c}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
/* body */
#body{display:grid;grid-template-columns:minmax(300px,32%) 1fr 300px 76px;min-height:0}
/* transcript */
#left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.lhead .src{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{font-size:12.5px;padding:5px 9px}
.actions .hint{color:var(--dim);font-size:12px;align-self:center}
#words{flex:1;overflow:auto;padding:16px 20px 60px;font-size:17px;line-height:1.85;user-select:none}
.u{border-radius:5px;padding:1px 2px;cursor:pointer;transition:background .08s}
.u:hover{background:#262833}
.u.out{color:var(--dim)}
.u.cut{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.u.hook{background:rgba(255,225,74,.16);color:var(--yellow)}
.u.keep{box-shadow:inset 0 -2px 0 var(--green)}
.u.sel{background:var(--blue-soft)!important;color:#fff}
.u.cur{color:#111!important;background:var(--accent)!important;text-decoration:none}
.u.pause{font-size:12px;color:var(--dim);border:1px dashed var(--line2);padding:0 6px;margin:0 2px;vertical-align:2px;white-space:nowrap}
.u.pause.cut{border-color:var(--red)}
.u.pause.keep{border-color:var(--green);color:var(--green)}
.para{display:block;height:10px}
/* stage */
#center{display:flex;flex-direction:column;align-items:center;min-height:0;padding:14px 10px 10px;background:radial-gradient(1200px 600px at 50% 0%,#191b22 0%,var(--bg) 60%)}
.stagebar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;color:var(--mute);font-size:13px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
#stage{position:relative;flex:1;min-height:0;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px var(--line)}
#stage canvas,#stage video.r{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#stage video.r{background:#000}
.stageinfo{margin-top:8px;color:var(--mute);font-size:12.5px;display:flex;gap:14px;align-items:center}
.stageinfo b{color:var(--text);font-weight:600}
/* panel */
#panel{border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:16px}
#panel h3{margin:0 0 12px;font-size:15px}
.field{margin-bottom:16px}
.field>label{display:block;color:var(--mute);font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input[type=text],.field input[type=number],.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.field textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card .t{font-weight:600}
.card .d{color:var(--mute);font-size:12px}
.mini{width:30px;height:52px;border-radius:5px;border:1px solid var(--line2);margin-bottom:6px;overflow:hidden;display:flex;flex-direction:column}
.mini i{display:block}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 9px;font-size:12.5px;color:var(--mute)}
.sugg button:hover{color:var(--text)}
.note{color:var(--mute);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.note.warn{color:#ffd36b;border-color:#5c4a17}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12.5px}
.li .sw{width:9px;height:9px;border-radius:3px}
.li .x{margin-left:auto;border:0;background:transparent;color:var(--mute)}
.toggle{display:flex;align-items:center;gap:10px;margin:6px 0}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.range input{width:100%;accent-color:var(--accent)}
.log{font:11.5px/1.5 ui-monospace,Menlo,monospace;background:#0a0b0e;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:220px;overflow:auto;white-space:pre-wrap;color:#b9bdc7}
.prog{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
/* rail */
#rail{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--bg2)}
#rail button{width:62px;border:0;background:transparent;border-radius:12px;padding:9px 0 7px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
#rail button svg{width:22px;height:22px}
#rail button.on{background:var(--panel2);color:var(--text)}
#rail button:hover{color:var(--text)}
/* timeline */
footer{border-top:1px solid var(--line);display:grid;grid-template-rows:44px 1fr;min-height:0;background:var(--bg2)}
.tlbar{display:flex;align-items:center;gap:10px;padding:0 14px}
.tlbar .time{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;min-width:150px}
.tlbar .time b{color:var(--text)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:16px;height:16px}
.legend{display:flex;gap:12px;color:var(--mute);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.zoom{display:flex;align-items:center;gap:8px;color:var(--mute)}
.zoom input{width:140px;accent-color:#fff}
#tlwrap{overflow-x:auto;overflow-y:hidden;position:relative;margin:0 14px 10px;border-radius:12px;background:#0d0e11;border:1px solid var(--line)}
#tl{display:block;height:100%}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.62);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:30}
.modal.open{display:flex}
.sheet{background:rgba(32,34,40,.96);border:1px solid var(--line2);border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-width:96vw}
.aspects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.aspects button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 13px;color:var(--text)}
.aspects button.on{background:#3a3d48;border-color:#5a5e6c}
#cropwrap{position:relative;border-radius:10px;overflow:hidden;user-select:none}
#cropwrap canvas{display:block}
#cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move}
#cropbox .h{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #222}
#cropbox .h.nw{left:-8px;top:-8px;cursor:nwse-resize}#cropbox .h.ne{right:-8px;top:-8px;cursor:nesw-resize}
#cropbox .h.sw{left:-8px;bottom:-8px;cursor:nesw-resize}#cropbox .h.se{right:-8px;bottom:-8px;cursor:nwse-resize}
#cropbox .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);border-radius:7px;padding:2px 8px;font-size:12px}
.sheetfoot{display:flex;gap:8px;margin-top:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:232px;transform:translateX(-50%) translateY(20px);background:#22252d;border:1px solid var(--line2);border-radius:12px;padding:9px 14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:70vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.banner{display:none;align-items:center;gap:10px;background:#2a2412;border:1px solid #5c4a17;color:#ffd36b;border-radius:10px;padding:6px 10px;font-size:12.5px;margin-top:8px}
.banner.show{display:flex}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mute);text-align:center;padding:30px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 4px;color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><i></i>Clip Editor</div>
    <select class="clip" id="clipSel" title="Clip"></select>
    <span class="chip" title="Output format">▯ <b>9:16</b></span>
    <span class="chip" id="layoutChip">Layout: <b>React</b></span>
    <span class="chip" id="camChip" style="cursor:pointer">Cam: <b>auto</b></span>
    <span class="chip" id="lenChip" title="Estimated length, with pauses trimmed like the render (it keeps loud pauses, so it can come out a bit longer)">≈ <b>0.0 s</b></span>
    <div class="grow"></div>
    <span class="chip" id="saveChip" style="display:none"></span>
    <button class="btn primary" id="renderTop">Render</button>
  </header>

  <div id="body">
    <section id="left">
      <div class="lhead">
        <div class="src" id="srcLine">Pick a clip</div>
        <div class="actions" id="actions">
          <button class="btn" data-act="cut" title="Cut the selection (Delete)">✂ Cut</button>
          <button class="btn" data-act="restore" title="Undo cuts and keeps in the selection">↺ Restore</button>
          <button class="btn" data-act="hook" title="Play this first (H)">⚡ Set as hook</button>
          <button class="btn" data-act="start" title="The clip starts here ([)">⟦ Start</button>
          <button class="btn" data-act="end" title="The clip ends here (])">End ⟧</button>
          <button class="btn" data-act="keep" title="Never trim this silent part (K)">◼ Keep silent</button>
          <span class="hint" id="selHint">Drag across words to select</span>
        </div>
        <div class="banner" id="draftBanner">Unsaved edits restored from this browser. <button class="btn small" id="discardDraft">Discard</button></div>
      </div>
      <div id="words"><div class="empty">Loading…</div></div>
    </section>

    <section id="center">
      <div class="stagebar">
        <div class="seg" id="modeSeg">
          <button data-mode="edit" class="on" title="Plays the hook, then the clip with your cuts">Edit preview</button>
          <button data-mode="free" title="Plays straight through from the playhead">Source</button>
          <button data-mode="rendered" title="The last rendered file">Rendered</button>
        </div>
        <button class="btn small" id="cropBtn">⛶ Crop webcam</button>
      </div>
      <div id="stage">
        <canvas id="cv" width="540" height="960"></canvas>
        <video class="r" id="rv" playsinline preload="auto" style="display:none"></video>
      </div>
      <div class="stageinfo" id="stageInfo"></div>
    </section>

    <aside id="panel"></aside>

    <nav id="rail">
      <button data-tab="layout" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 10h12"/></svg>Layout</button>
      <button data-tab="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
      <button data-tab="captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg>Caption</button>
      <button data-tab="hook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Hook</button>
      <button data-tab="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6"/></svg>Edit</button>
      <button data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 8l5-5 5 5M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Export</button>
    </nav>
  </div>

  <footer>
    <div class="tlbar">
      <button class="iconbtn" id="playBtn" title="Play / pause (Space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
      <div class="time" id="timeLbl"><b>0:00.0</b></div>
      <button class="btn small ghost" id="undoBtn" title="Undo (⌘Z)">↶ Undo</button>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>clip</span>
        <span><i style="background:var(--yellow)"></i>hook</span>
        <span><i style="background:var(--red)"></i>cut</span>
        <span><i style="background:var(--green)"></i>keep</span>
        <span><i style="background:#3a3d46"></i>trimmed pause</span><span><i style="background:#58d0ff"></i>last render</span>
        <span style="color:var(--dim)">drag edges · <kbd>shift</kbd>-drag selects</span>
      </div>
      <div class="grow"></div>
      <div class="zoom">−<input type="range" id="zoom" min="1" max="12" step="0.1" value="1">+</div>
    </div>
    <div id="tlwrap"><canvas id="tl"></canvas></div>
  </footer>
</div>

<div class="modal" id="cropModal">
  <div class="sheet">
    <div class="aspects" id="aspects">
      <button data-a="free">⬚ Custom</button>
      <button data-a="panel" title="The exact shape of the top panel in the react layout">▭ Panel</button>
      <button data-a="orig">▢ Original</button>
      <button data-a="0.5625">▯ 9:16</button>
      <button data-a="1">□ 1:1</button>
      <button data-a="1.7778">▭ 16:9</button>
      <button data-a="1.3333">▭ 4:3</button>
    </div>
    <div id="cropwrap"><canvas id="cropcv"></canvas><div id="cropbox"><span class="tag">Webcam</span><i class="h nw"></i><i class="h ne"></i><i class="h sw"></i><i class="h se"></i></div></div>
    <div class="sheetfoot">
      <button class="btn" id="cropClose">Close</button>
      <span style="color:var(--mute);font-size:12.5px" id="cropInfo"></span>
      <div class="grow"></div>
      <button class="btn" id="cropAuto" title="Let cut.py find the webcam at render time">Auto-detect</button>
      <button class="btn primary" id="cropApply">Apply</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<video id="v" playsinline preload="auto" style="display:none"></video>

<script>
"use strict";
// ---------------------------------------------------------------- constants (match cut.py)
const W = 1080, H = 1920, TOP = 730, GAME_H = H - TOP, K = 0.5;
const CAP_Y = { fill: 1380, blur: 1460, facecam: 1120, react: 1560 };
const CAP_PX = 118 * 0.786, TITLE_PX = 80 * 0.786;   // libass sizes as rendered (LIBASS_SCALE in cut.py)
const LAYOUTS = { react: "React", fill: "Fill", blur: "Blur", facecam: "Facecam" };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(1).padStart(4, "0")}`; };

let P = null, S = null, units = [], groups = [], stripImg = null, stripInfo = null;
let mode = "edit", playing = false, pl = [], pi = 0, rewindUntil = 0, flashUntil = 0, pendingSeek = null;
let sel = null, tab = "layout", undo = [], renderId = null, renderPoll = null, cropTmp = null;
const v = $("#v"), cv = $("#cv"), ctx = cv.getContext("2d"), rv = $("#rv");

function toast(msg, ms = 1800) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.statusText); return j;
}
// Rendered view: output time <-> source time through the edit pieces cut.py saved (hook, rewind, clip pieces)
function rPieces() {
  let o = 0;
  return (P?.rendered?.segments || []).map((sg, i) => { const rw = sg.length > 2, len = rw ? +sg[3] : sg[1] - sg[0]; const r = { a: +sg[0], b: +sg[1], rw, o, len, hook: i === 0 && !!P.rendered.tease }; o += len; return r; });
}
function srcFromOut(t) {
  const ps = rPieces(); const r = ps.find(p => t >= p.o && t < p.o + p.len) || ps[ps.length - 1]; if (!r) return P.video.offset;
  const k = clamp((t - r.o) / r.len, 0, 1); return r.rw ? r.b - k * (r.b - r.a) : r.a + (t - r.o);
}
function outFromSrc(t) {
  const ps = rPieces().filter(p => !p.rw);
  const r = ps.find(p => !p.hook && t >= p.a && t <= p.b) || ps.find(p => t >= p.a && t <= p.b);
  if (r) return r.o + (t - r.a);
  const nx = ps.filter(p => !p.hook).find(p => p.a > t); return nx ? nx.o : (ps.length ? ps[ps.length - 1].o + ps[ps.length - 1].len - 0.05 : 0);
}
const inRendered = () => mode === "rendered" && P?.rendered;
const tNow = () => (!P ? 0 : inRendered() ? srcFromOut(rv.currentTime) : v.currentTime + P.video.offset);
const seek = t => { if (!P) return; if (inRendered()) { rv.currentTime = clamp(outFromSrc(t), 0, P.rendered.dur - 0.02); return; } v.currentTime = clamp(t - P.video.offset, 0, P.video.dur - 0.02); };
const vMin = () => P.video.offset, vMax = () => P.video.offset + P.video.dur;

// ---------------------------------------------------------------- ranges
function merge(list) {
  const s = list.filter(([a, b]) => b - a > 0.02).map(([a, b]) => [+a, +b]).sort((x, y) => x[0] - y[0]); const out = [];
  for (const r of s) { const l = out[out.length - 1]; if (l && r[0] <= l[1] + 0.01) l[1] = Math.max(l[1], r[1]); else out.push(r); }

});
$("#panel").addEventListener("change", e => {
  const id = e.target.id, val = e.target.value;
  if (id === "pHookOn") change(() => { S.tease = e.target.checked ? (P.state.tease || [clamp(tNow(), vMin(), vMax() - 1.5), clamp(tNow(), vMin(), vMax() - 1.5) + 1.5]) : null; });
  if (id === "pT0" || id === "pT1") { const a = +$("#pT0").value, b = +$("#pT1").value; if (b - a >= 0.4 && b - a <= 4) change(() => { S.tease = [a, b]; }); else { toast("Hook must be 0.4–4 s"); panel(); } }
  if (id === "pS" || id === "pE") { const a = +$("#pS").value, b = +$("#pE").value; if (b - a >= 1) change(() => { S.start = clamp(a, vMin(), vMax()); S.end = clamp(b, vMin(), vMax()); }); else panel(); }
  if (id === "pTrim") change(() => { S.trim = e.target.checked; });
  if (id === "pPunch") change(() => { S.punch = e.target.checked; });
  if (id === "pTight") change(() => { S.tighten = +val; });
  if (id === "pName") { const n = val.trim(); if (/^[A-Za-z0-9_\-]{1,60}$/.test(n)) { P.name = n; toast("Renders to " + n + ".mp4"); } else { toast("Letters, digits, _ and - only"); e.target.value = P.name; } }
});
$("#panel").addEventListener("input", e => {
  if (e.target.id === "pTitle") { S.title = e.target.value; saveDraft(); }
  if (e.target.id === "pTight") $("#tightLbl").textContent = +e.target.value > 0 ? (+e.target.value).toFixed(2) + " s" : "off";
});
$("#panel").addEventListener("focusout", e => { if (e.target.id === "pTitle") refresh(); });

// ---------------------------------------------------------------- render
let lastStatus = null;
async function doRender() {
  if (!P || renderId) return;
  if (S.tease && (S.tease[1] - S.tease[0] < 0.4 || S.tease[1] - S.tease[0] > 4)) return toast("Hook must be 0.4–4 s");
  try {
    const r = await api("/api/render", { job: P.job, name: P.name, set: P.set, pick: P.pick, state: S });
    renderId = r.id; lastStatus = { state: "running", stage: "starting", log: [], elapsed: 0 };
    tab = "export"; $$("#rail button").forEach(x => x.classList.toggle("on", x.dataset.tab === "export")); refresh();
    pollRender();
  } catch (e) { toast(e.message, 3000); }
}
async function pollRender() {
  if (!renderId) return;
  try { lastStatus = await api("/api/render?id=" + renderId); } catch (e) { lastStatus = { state: "error", log: [e.message] }; }
  showStatus(lastStatus); headerRender();
  if (lastStatus.state === "running") { renderPoll = setTimeout(pollRender, 1000); return; }
  renderId = null;
  if (lastStatus.state === "done") {
    toast("Rendered ✓"); clearDraft();
    const keepS = JSON.stringify(S), name = P.name;
    await openClip({ job: P.job, name }); S = JSON.parse(keepS); refresh(); setMode("rendered"); rv.currentTime = 0; play();
  } else toast("Render failed, see the log", 3000);
  panel(); headerRender();
}
function showStatus(s) {
  const el = $("#rstat"); if (!el) return;
  el.innerHTML = (s.state === "running" ? `<div class="prog"><i></i></div><div style="color:var(--mute);font-size:12.5px">${esc(s.stage)} · ${Math.round(s.elapsed)} s</div>` :
    s.state === "done" ? `<div style="color:var(--accent);margin:10px 0">✓ Done in ${Math.round(s.elapsed)} s</div>` : `<div style="color:var(--red);margin:10px 0">✕ Failed</div>`) +
    (s.log?.length ? `<div class="log" style="margin-top:8px">${esc(s.log.join("\n"))}</div>` : "");
}
function headerRender() { const b = $("#renderTop"); b.disabled = !!renderId; b.textContent = renderId ? "Rendering…" : "Render"; }
$("#renderTop").onclick = doRender;

// ---------------------------------------------------------------- refresh + keys
function refresh(light) {
  if (!P) return;
  $("#layoutChip").innerHTML = `Layout: <b>${LAYOUTS[S.layout] || S.layout}</b>`;
  $("#camChip").innerHTML = `Cam: <b>${S.cam === "auto" ? "auto" : "manual"}</b>`;
  const len = estLen(); const lc = $("#lenChip"); lc.innerHTML = `≈ <b>${len.toFixed(1)} s</b>`; lc.className = "chip " + (len >= 12 && len <= 25 ? "ok" : "warn");
  $("#stageInfo").innerHTML = mode === "rendered" && P.rendered ? `Rendered file · <b>${P.rendered.dur.toFixed(1)} s</b>` :
    `Live preview · ${S.tease ? `hook <b>${(S.tease[1] - S.tease[0]).toFixed(1)} s</b> → ${S.transition} → ` : ""}clip <b>${(len - (S.tease ? S.tease[1] - S.tease[0] + (S.transition === "rewind" ? .6 : 0) : 0)).toFixed(1)} s</b> · pauses trimmed like the render`;
  if (!light) { paintWords(); panel(); updSelHint(); }
  drawTL();
}
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ($("#cropModal").classList.contains("open")) { if (e.key === "Escape") closeCrop(); if (e.key === "Enter") $("#cropApply").click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); const u = undo.pop(); if (u) { S = JSON.parse(u); saveDraft(); refresh(); toast("Undone"); } return; }
  if (typing || !P) return;
  if (e.key === " ") { e.preventDefault(); playing ? stop() : play(); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); act("cut"); }
  else if (e.key.toLowerCase() === "h") act("hook");
  else if (e.key.toLowerCase() === "k") act("keep");
  else if (e.key === "[") act("start");
  else if (e.key === "]") act("end");
  else if (e.key === "Escape") { sel = null; paintWords(); updSelHint(); drawTL(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); seek(tNow() + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 1 : 0.1)); }
});
$("#undoBtn").onclick = () => { const u = undo.pop(); if (u) { S = JSON.parse(u); saveDraft(); refresh(); toast("Undone"); } };
$("#discardDraft").onclick = () => { clearDraft(); S = JSON.parse(JSON.stringify(P.state)); $("#draftBanner").classList.remove("show"); refresh(); };
$("#clipSel").addEventListener("change", e => openClip(JSON.parse(e.target.value)));
v.addEventListener("seeked", () => { if (!playing) { paintCur(tNow()); } });

Promise.all([document.fonts.load("900 40px Montserrat"), document.fonts.load("800 40px Montserrat")]).catch(() => {}).finally(() => {
  loadClips(true).catch(e => { $("#words").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
