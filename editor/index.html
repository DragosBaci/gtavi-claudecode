<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Editor</title>
<style>
@font-face{font-family:"Montserrat";font-weight:900;src:url(/fonts/Montserrat-Black.ttf) format("truetype")}
@font-face{font-family:"Montserrat";font-weight:800;src:url(/fonts/Montserrat-ExtraBold.ttf) format("truetype")}
:root{
  --text:#f4eeeb;--soft:#cdbfba;--mute:#9a8c87;--dim:#6c605c;
  --glass:rgba(64,50,47,.62);--glass2:rgba(78,62,58,.78);--edge:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --lime:#c9f26e;--lime-ink:#1d2408;--yellow:#ffe14a;--red:#ff6b6b;--green:#6ee7b7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0909;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{display:block}
/* frame */
#app{position:fixed;inset:10px;border-radius:30px;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;
  background:radial-gradient(900px 620px at 57% 88%,rgba(126,64,46,.62),transparent 70%),radial-gradient(700px 500px at 18% 12%,rgba(70,46,40,.45),transparent 70%),linear-gradient(160deg,#1d1615 0%,#181212 55%,#201513 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.04)}
#top{display:grid;grid-template-columns:minmax(320px,33%) 1fr 104px;grid-template-rows:minmax(0,1fr);min-height:0;height:100%;overflow:hidden;position:relative}
/* transcript */
#left{display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(255,255,255,.055);padding:22px 0 0}
.lhead{display:flex;align-items:center;gap:10px;padding:0 26px 14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge);background:rgba(255,255,255,.03);border-radius:12px;padding:8px 14px;color:var(--text);white-space:nowrap;max-width:100%}
.pill:hover{background:var(--hover)}
.pill .t{overflow:hidden;text-overflow:ellipsis;max-width:300px}
.peers{display:flex;align-items:center}
.peers i{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:#1b1412;margin-left:-6px;box-shadow:0 0 0 2px #1d1615}
.peers i:first-child{margin-left:0}
.me{cursor:pointer}
.src{color:var(--mute);font-size:13px;padding:0 26px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restored{display:none;margin:4px 26px 8px;color:#ffd99a;font-size:13px;align-items:center;gap:10px}
.restored.show{display:flex}
.restored button{color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:2px 9px}
#words{flex:1;overflow:auto;padding:8px 26px 120px;font-size:18px;line-height:1.75;user-select:none;color:var(--text)}
#words::-webkit-scrollbar{width:8px}#words::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
.u{border-radius:6px;padding:1px 1px;cursor:pointer}
.u:hover{background:rgba(255,255,255,.06)}
.u.out{color:var(--dim)}
.u.hook{color:var(--lime)}
.u.cut{color:#c98d8d;text-decoration:line-through;text-decoration-color:rgba(255,107,107,.8);text-decoration-thickness:2px;opacity:.6}
.u.sel{background:rgba(201,242,110,.2)!important;color:#fff}
.u.cur{box-shadow:inset 0 -2px 0 var(--lime);color:#fff}
.u.pause{color:var(--dim);font-size:14px;padding:0 3px}
.u.pause.keep{color:var(--green)}
.u.pause.cut{text-decoration:none;color:#c98d8d}
.para{display:block;height:14px}
/* floating selection toolbar */
#selbar{position:fixed;z-index:20;display:none;gap:2px;padding:5px;border-radius:14px;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--edge);box-shadow:0 14px 40px rgba(0,0,0,.45)}
#selbar.show{display:flex}
#selbar button{padding:7px 11px;border-radius:9px;font-size:13.5px;white-space:nowrap}
#selbar button:hover{background:var(--hover)}
#selbar .len{color:var(--mute);font-size:12.5px;padding:7px 8px 7px 4px}
/* center */
#center{display:flex;flex-direction:column;align-items:center;min-height:0;height:100%;overflow:visible;padding:16px 20px 12px;position:relative}
#toolbar{display:flex;align-items:center;gap:6px;margin-bottom:16px;position:relative;z-index:15}
.tb{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;font-size:15.5px;color:var(--text);white-space:nowrap}
.tb:hover,.tb.open{background:rgba(255,255,255,.08)}
.tb svg{width:20px;height:20px;opacity:.95}
.tb .on{color:var(--lime)}
.menu{position:absolute;top:52px;min-width:300px;padding:8px;border-radius:20px;background:var(--glass2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.5);display:none;z-index:30}
.menu.open{display:block}
.menu .mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px;cursor:pointer}
.menu .mi{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border-radius:12px;font-size:16px;text-align:left}
.menu .mi:hover{background:rgba(255,255,255,.08)}
.menu .mi svg{width:22px;height:22px}
.menu .mi .ck{margin-left:auto;opacity:0}
.menu .mi.on .ck{opacity:1}
.menu .mi .d{color:var(--mute);font-size:12.5px;display:block}
.menu .grp{color:var(--mute);font-size:12px;padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.06em}
#clipMenu{left:0;top:48px;width:440px;max-height:60vh;overflow:auto}
#stage{position:relative;flex:1 1 0;min-height:0;height:0;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,.5)}
#stage canvas,#stage video{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.modes{display:flex;gap:2px;margin-top:12px;padding:3px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.modes button{padding:5px 12px;border-radius:9px;color:var(--mute);font-size:13px}
.modes button.on{background:rgba(255,255,255,.1);color:var(--text)}
/* right rail + floating panel */
#rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 0;overflow-y:auto;min-height:0}
#rail button{width:84px;padding:7px 0 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--text);flex-shrink:0}
#rail button svg{width:25px;height:25px}
#rail button:hover{background:rgba(255,255,255,.05)}
#rail button.on{background:rgba(255,255,255,.1)}
#panel{position:absolute;right:112px;top:70px;width:300px;max-height:calc(100% - 86px);overflow:auto;border-radius:22px;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.45);display:none;z-index:12}
#panel.open{display:block}
#panel .ph{padding:16px 20px 14px;font-size:20px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
#panel .ph button{color:var(--mute);font-size:18px}
#panel .pb{padding:16px 18px 20px}
.field{margin-bottom:16px}
.field>label{display:block;color:var(--mute);font-size:12px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:12px;padding:9px 11px;outline:none}
.inp:focus{border-color:rgba(201,242,110,.5)}
textarea.inp{resize:vertical;min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border-radius:14px;padding:11px 12px;text-align:left;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06)}
.card:hover{background:rgba(255,255,255,.06)}
.card.on{border-color:var(--lime);background:rgba(201,242,110,.1)}
.card .t{font-weight:600;font-size:14px}
.card .d{color:var(--mute);font-size:12px;line-height:1.35;margin-top:2px}
.card.wide{grid-column:1/-1}
.btnx{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:9px 14px;background:rgba(255,255,255,.07);border:1px solid var(--edge);white-space:nowrap}
.btnx:hover{background:rgba(255,255,255,.12)}
.btnx.white{background:#fff;color:#111;border-color:#fff;font-weight:600}
.btnx.white:hover{background:#f1f1f1}
.btnx:disabled{opacity:.45;cursor:default}
.btnx.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.note{color:var(--soft);font-size:13px;line-height:1.45;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.note.warn{color:#ffd99a;border-color:rgba(255,200,100,.2)}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06)}
.seg button{flex:1;padding:7px 8px;border-radius:9px;color:var(--mute);font-size:13.5px}
.seg button.on{background:rgba(255,255,255,.12);color:var(--text)}
.toggle{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.toggle input{accent-color:var(--lime);width:17px;height:17px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;font-size:13px}
.li i{width:8px;height:8px;border-radius:3px}
.li .x{margin-left:auto;color:var(--mute)}
.log{font:11.5px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.3);border-radius:12px;padding:9px;max-height:200px;overflow:auto;white-space:pre-wrap;color:#d6cbc7;margin-top:10px}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{text-align:left;border-radius:10px;padding:7px 10px;font-size:13px;color:var(--soft);background:rgba(0,0,0,.18)}
.sugg button:hover{color:var(--text);background:rgba(255,255,255,.06)}
input[type=range]{accent-color:#fff;width:100%}
code{font:12px ui-monospace,Menlo,monospace;color:#f0d8cf}
pre.code{font:11.5px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.3);border-radius:12px;padding:10px;white-space:pre-wrap;color:#f0d8cf;margin:8px 0}
/* timeline */
#bottom{border-top:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);display:flex;flex-direction:column;position:relative}
.tlbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 22px 4px}
.tl-left,.tl-right{display:flex;align-items:center;gap:6px}
.tl-right{justify-content:flex-end}
.ib{display:inline-flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;color:var(--text);font-size:15px}
.ib:hover{background:var(--hover)}
.ib svg{width:22px;height:22px}
.transport{display:flex;align-items:center;gap:10px}
.transport .ib svg{width:26px;height:26px}
#playBtn svg{width:30px;height:30px}
.time{font-variant-numeric:tabular-nums;font-size:16px;margin-left:10px;color:var(--text)}
.time span{color:var(--mute)}
.zoomer{display:flex;align-items:center;gap:6px}
.zoomer input{width:180px}
#tlwrap{overflow-x:auto;overflow-y:hidden;padding:0 22px 64px;position:relative}
#tlwrap::-webkit-scrollbar{height:8px}#tlwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
#tl{display:block}
#bottom.collapsed #tlwrap{display:none}
/* dock */
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 7px 7px 20px;border-radius:999px;background:rgba(48,38,36,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:14;white-space:nowrap}
#dock .info{color:var(--soft);font-size:15px;display:flex;align-items:center;gap:10px}
#dock .info b{color:var(--text);font-weight:600}
#dock .len.ok{color:var(--lime)}#dock .len.warn{color:#ffd99a}
#renderBtn{background:#fff;color:#111;font-weight:600;font-size:16px;border-radius:999px;padding:12px 26px}
#renderBtn:disabled{opacity:.6;cursor:default}
/* crop modal */
.modal{position:fixed;inset:0;background:rgba(10,7,7,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:40}
.modal.open{display:flex}
.sheet{background:rgba(70,56,52,.86);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--edge);border-radius:26px;padding:20px;box-shadow:0 40px 90px rgba(0,0,0,.6);max-width:96vw}
.aspects{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.aspects button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge);background:rgba(0,0,0,.15);border-radius:12px;padding:9px 16px;font-size:16px}
.aspects button.on{background:rgba(255,255,255,.14)}
.aspects i{display:inline-block;border:2px solid currentColor;border-radius:3px}
#cropwrap{position:relative;border-radius:12px;overflow:hidden;user-select:none}
#cropwrap canvas{display:block}
#cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move}
#cropbox .h{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #333}
#cropbox .h.nw{left:-9px;top:-9px;cursor:nwse-resize}#cropbox .h.ne{right:-9px;top:-9px;cursor:nesw-resize}
#cropbox .h.sw{left:-9px;bottom:-9px;cursor:nesw-resize}#cropbox .h.se{right:-9px;bottom:-9px;cursor:nwse-resize}
.sheetfoot{display:flex;gap:10px;margin-top:16px;align-items:center}
.sheetfoot .grow{flex:1}
/* live cursors */
#cursors{position:fixed;inset:0;pointer-events:none;z-index:60}
.pcur{position:absolute;left:0;top:0;transition:transform .16s linear;will-change:transform}
.pcur.agent{transition:transform .55s cubic-bezier(.45,.05,.25,1)}
.pcur svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pcur .tag{position:absolute;left:22px;top:20px;padding:4px 11px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pcur .say{position:absolute;left:22px;top:52px;padding:6px 11px;border-radius:12px;font-size:13px;background:rgba(30,24,22,.92);color:var(--text);border:1px solid var(--edge);white-space:nowrap;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pcur .say.show{display:block}
.ripple{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid;pointer-events:none;z-index:61;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-10px);background:rgba(48,38,36,.95);border:1px solid var(--edge);border-radius:14px;padding:10px 16px;opacity:0;transition:.2s;z-index:70;pointer-events:none;max-width:70vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mute);padding:30px 0}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--edge);border-radius:5px;padding:0 4px;color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <section id="left">
      <div class="lhead">
        <button class="pill" id="clipBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="t" id="clipName">Open a clip</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="peers" id="peers"></div>
        <div class="menu" id="clipMenu"></div>
      </div>
      <div class="src" id="srcLine"></div>
      <div class="restored" id="restored">Edits restored <button id="discard">Discard</button></div>
      <div id="words"><div class="empty">Loading…</div></div>
    </section>

    <section id="center">
      <div id="toolbar">
        <span class="tb" title="Output format"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="3" width="10" height="18" rx="2.5"/></svg>9:16</span>
        <button class="tb" id="layoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg><span id="layoutLbl">Layout: Split</span></button>
        <button class="tb" id="trackBtn" title="Webcam: auto-detect (ON) or your own crop (OFF)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="10.5" r="2.5"/><path d="M8 17c.8-1.8 2.3-2.7 4-2.7s3.2.9 4 2.7"/></svg><span id="trackLbl">Track: ON</span></button>
        <button class="tb" id="hookBtn" title="Play the hook first (Shift+H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="hookLbl">Hook: ON</span></button>
        <div class="menu" id="layoutMenu" style="left:60px"></div>
      </div>
      <div id="stage">
        <canvas id="cv" width="540" height="960"></canvas>
        <video id="rv" playsinline preload="auto" style="display:none"></video>
      </div>
      <div class="modes" id="modes">
        <button data-mode="edit" class="on" title="Hook, transition, then the clip with your cuts">Edit preview</button>
        <button data-mode="free" title="The source, straight through">Source</button>
        <button data-mode="rendered" title="The last rendered file">Rendered</button>
      </div>
    </section>

    <nav id="rail">
      <button data-tab="claude"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.6 3.9 2.4 5.8 6.3 6.4-3.9.6-5.7 2.5-6.3 6.4-.6-3.9-2.4-5.8-6.3-6.4 3.9-.6 5.7-2.5 6.3-6.4ZM18.5 14c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2Z"/></svg>Claude</button>
      <button data-tab="captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M16.5 10.2a2.2 2.2 0 1 0 0 3.6"/></svg>Caption</button>
      <button data-tab="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
      <button data-tab="layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 10h12"/></svg>Layout</button>
      <button data-tab="transitions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c6 0 10 14 16 14M4 19c6 0 10-14 16-14M4 5v14M20 5v14"/></svg>Transitions</button>
      <button data-tab="hook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>Hook</button>
      <button data-tab="trim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6"/></svg>Trim</button>
      <button data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3M7 8l5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Export</button>
    </nav>
    <aside id="panel"></aside>
  </div>

  <div id="bottom">
    <div class="tlbar">
      <div class="tl-left">
        <button class="ib" id="hideTl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m9 11 3 3 3-3"/></svg><span id="hideLbl">Hide timeline</span></button>

<script>
"use strict";
// ================================================================ constants (match cut.py)

const LAYOUTS = [   // key, menu name, description

  ["react", "Split", "Webcam on top, game below, title on the seam"], ["facecam", "Gameplay", "Small webcam on top, more game"]];

const LICON = {

  blur: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h5V4M20 9h-5V4M20 15h-5v5M4 15h5v5M4 4l5 5M20 4l-5 5M20 20l-5-5M4 20l5-5"/></svg>`,
  react: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 11h16"/></svg>`,
  facecam: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16"/></svg>`,
};
const BLEND = { zoom: 0.35, whip: 0.30, slide: 0.30, fade: 0.45, pixel: 0.40, circle: 0.40, dissolve: 0.35 };
const WHOOSH = new Set(["zoom", "whip", "slide", "pixel"]);
const TRANS_LIST = [["zoom", "Zoom", "Pushes into the clip · whoosh"], ["whip", "Whip", "Motion-blur swipe · whoosh"],
  ["slide", "Slide up", "The clip pushes up · whoosh"], ["fade", "Dip to black", "Quick fade through black"],
  ["pixel", "Pixelate", "Pixels out and back · whoosh"], ["circle", "Circle", "A circle opens onto the clip"],
  ["dissolve", "Dissolve", "Grainy crossfade"], ["flash", "Flash", "White flash, hard cut"],
  ["cut", "Cut", "Hard cut"], ["rewind", "Rewind", "Plays backwards to the start"]];
const PALETTE = ["#e9c46a", "#a3e36e", "#7cc4ff", "#ff9c8a", "#c9a2ff", "#6fe3cf"];
const NAMES = ["Tomas", "James", "Ava", "Maya", "Leo", "Nora", "Ines", "Hugo"];
const AGENT_COLOR = "#e0866a";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(1).padStart(4, "0")}`; };
const fmt2 = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return `${String(m).padStart(2, "0")}:${(t - m * 60).toFixed(2).padStart(5, "0")}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

let P = null, S = null, units = [], groups = [], stripImg = null, stripInfo = null, waveData = null, clipList = [];
let mode = "edit", playing = false, pl = [], pi = 0, rewindUntil = 0, flashUntil = 0, trans = null, AC = null;
let sel = null, tab = null, undo = [], renderId = null, cropTmp = null, lastStatus = null, muted = false;
const v = $("#v"), v2 = $("#v2"), cv = $("#cv"), rv = $("#rv");
let ctx = cv.getContext("2d");
const blendLen = () => S.tease && BLEND[S.transition] ? Math.min(BLEND[S.transition], (S.tease[1] - S.tease[0]) * 0.5) : 0;

// who am I (for live cursors)
const ME = (() => {
  let m = lsGet("clipeditor:me", null);
  if (!m) { const i = Math.floor(Math.random() * NAMES.length); m = { name: NAMES[i], color: PALETTE[i % PALETTE.length] }; lsSet("clipeditor:me", m); }
  m.sid = Math.random().toString(36).slice(2, 10); return m;
})();

function toast(msg, ms = 1900) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.statusText); return j;
}

// ================================================================ time mapping
function rPieces() {   // rendered file: output time <-> source time through the saved edit pieces
  let o = 0; const ov = +(P?.rendered?.transition?.overlap || 0);
  return (P?.rendered?.segments || []).map((sg, i) => { if (i === 1) o -= ov; const rw = sg.length > 2, len = rw ? +sg[3] : sg[1] - sg[0]; const r = { a: +sg[0], b: +sg[1], rw, o, len, hook: i === 0 && !!P.rendered.tease }; o += len; return r; });
}
function srcFromOut(t) {
  const ps = rPieces(); const r = ps.find(p => t >= p.o && t < p.o + p.len) || ps[ps.length - 1]; if (!r) return P.video.offset;
  const k = clamp((t - r.o) / r.len, 0, 1); return r.rw ? r.b - k * (r.b - r.a) : r.a + (t - r.o);
}
function outFromSrc(t) {

  const r = ps.find(p => !p.hook && t >= p.a && t <= p.b) || ps.find(p => t >= p.a && t <= p.b);
  if (r) return r.o + (t - r.a);
  const nx = ps.filter(p => !p.hook).find(p => p.a > t); return nx ? nx.o : (ps.length ? ps[ps.length - 1].o + ps[ps.length - 1].len - 0.05 : 0);
}
const inRendered = () => mode === "rendered" && P?.rendered;
const tNow = () => (!P ? 0 : inRendered() ? srcFromOut(rv.currentTime) : v.currentTime + P.video.offset);

// ================================================================ ranges
function merge(list) {
  const s = list.filter(([a, b]) => b - a > 0.02).map(([a, b]) => [+a, +b]).sort((x, y) => x[0] - y[0]); const out = [];
  for (const r of s) { const l = out[out.length - 1]; if (l && r[0] <= l[1] + 0.01) l[1] = Math.max(l[1], r[1]); else out.push(r); }
  return out.map(([a, b]) => [+a.toFixed(3), +b.toFixed(3)]);
}
const subtract = (list, [a, b]) => merge(list.flatMap(([x, y]) => [[x, Math.min(y, a)], [Math.max(x, b), y]]));
const inside = (list, a, b) => list.some(([x, y]) => x <= a + 0.01 && b - 0.01 <= y);

// ================================================================ state changes: undoable, saved as a draft, shared with other windows
let stateDirty = null, knownV = 0;
function change(fn, label, quiet) {
  undo.push(JSON.stringify(S)); if (undo.length > 100) undo.shift();
  fn(); saveDraft(); refresh(); if (label && !quiet) toast(label);
  stateDirty = label || "edited";
}
const draftKey = () => P ? `clipeditor:${P.job}:${P.name}` : "";
function saveDraft() { lsSet(draftKey(), { S, at: Date.now(), base: P.rendered?.updated || 0 }); }
function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (e) {} }
function doUndo() { const u = undo.pop(); if (u) { S = JSON.parse(u); saveDraft(); refresh(); stateDirty = "undo"; toast("Undone"); } }

// ================================================================ edit plan (mirrors cut.py's edit list)
function keepIntervals(s0, e0) {   // cut.py keep_intervals(), without the loudness check (the render keeps loud pauses)
  const ws = P.words.filter(w => w.s >= s0 && w.s < e0); if (!ws.length) return [[s0, e0]];
  let a = s0, b = e0;
  if (S.trim) { a = Math.max(s0, ws[0].s - 0.12); b = Math.min(e0, ws[ws.length - 1].e + 0.35); }
  const out = []; let cur = a;
  if (S.tighten > 0) for (let i = 0; i < ws.length - 1; i++) {
    const w = ws[i], nx = ws[i + 1], ga = w.e + 0.15, gb = nx.s - 0.10;
    if (nx.s - w.e > S.tighten && gb - ga >= 0.25 && ga > cur && gb < b) {
      let cuts = [[ga, gb]];
      for (const [ka, kb] of S.keep) cuts = cuts.flatMap(([x, y]) => [[x, Math.min(y, ka)], [Math.max(x, kb), y]]).filter(([x, y]) => y - x >= 0.25);
      for (const [x, y] of cuts) { out.push([cur, x]); cur = y; }

}
function mainPieces() {
  let e = S.end; const hookIn = S.tease && !S.keep_after_tease && S.tease[0] >= S.start && S.tease[0] < S.end;
  if (hookIn) {
    e = Math.min(e, S.tease[1] + 0.8);
    const nxt = P.words.find(w => w.s > S.tease[1] + 0.1);
    if (nxt && nxt.s < e) e = Math.max(S.tease[1] + 0.3, nxt.s - 0.05);
  }
  let pcs = keepIntervals(S.start, e);
  for (const [x, y] of S.drop) pcs = pcs.flatMap(([p, q]) => [[p, Math.min(q, x)], [Math.max(p, y), q]]).filter(([p, q]) => q - p > 0.05);
  if (hookIn && pcs.length) pcs[pcs.length - 1][1] = Math.max(pcs[pcs.length - 1][1], Math.min(e, S.tease[1] + 0.3));

}
function plan() {
  const m = mainPieces().map(([a, b]) => ({ a, b, kind: "clip" }));

}
function estLen() { return plan().reduce((s, x) => s + x.b - x.a, 0) + (S.tease && S.transition === "rewind" ? 0.6 : 0) - blendLen(); }
function editPos(t) {   // where source time t lands in the edit (null if cut)
  const p = plan(); let acc = 0;
  for (let i = 0; i < p.length; i++) {
    const x = p[i]; if (i === 1 && S.tease) acc += S.transition === "rewind" ? 0.6 : -blendLen();
    if (t >= x.a && t <= x.b && (!playing || i >= pi)) return acc + t - x.a;
    acc += x.b - x.a;
  }
  return null;
}

// ================================================================ loading
async function loadClips(openFirst) {
  clipList = await api("/api/clips");
  const items = clipList.map(j => `<div class="grp">${esc((j.channel ? j.channel + " · " : "") + (j.title || j.job)).slice(0, 70)}</div>` +
    j.clips.filter(c => c.editable).map(c => `<button class="mi" data-open='${esc(JSON.stringify({ job: j.job, name: c.name }))}'><span>${esc(c.title)}<span class="d">${esc(c.name)} · ${esc(LNAME[c.layout] || c.layout || "")}</span></span></button>`).join("") +
    j.picks.map(p => `<button class="mi" data-open='${esc(JSON.stringify({ job: j.job, set: p.set, pick: p.n }))}'><span>＋ New from pick ${esc(p.tag || p.n)}<span class="d">${esc(p.title || fmt(p.start))}</span></span></button>`).join("")).join("");
  $("#clipMenu").innerHTML = items || `<div class="grp">No clips yet</div>`;
  const q = new URLSearchParams(location.search);
  if (openFirst) {
    let x = q.get("job") ? { job: q.get("job"), name: q.get("name") } : null;
    if (!x) { const j = clipList.find(j => j.clips.some(c => c.editable)); if (j) x = { job: j.job, name: j.clips.find(c => c.editable).name }; }
    if (x) openClip(x);
  }
}
async function openClip(x) {
  stop(); $("#words").innerHTML = `<div class="empty">Loading…</div>`;
  const q = new URLSearchParams(Object.entries(x).filter(([, v]) => v != null)).toString();
  try { P = await api("/api/project?" + q); } catch (e) { $("#words").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  history.replaceState(null, "", "?" + new URLSearchParams({ job: P.job, name: P.name }));
  S = JSON.parse(JSON.stringify(P.state)); undo = []; sel = null; knownV = 0; stateDirty = null;
  let restored = false;
  const d = lsGet(draftKey(), null);
  if (d && d.base === (P.rendered?.updated || 0) && JSON.stringify(d.S) !== JSON.stringify(S)) { S = d.S; restored = true; }
  $("#restored").classList.toggle("show", restored);
  $("#clipName").textContent = P.state.title || P.name;
  $("#srcLine").textContent = `${P.source.channel || ""} · ${P.source.title || ""}`;
  v.src = P.video.url; v.load(); v2.src = P.video.url; v2.load(); v.muted = muted;
  rv.src = P.rendered ? P.rendered.url : ""; if (!P.rendered && mode === "rendered") setMode("edit");
  buildUnits(); buildGroups();
  stripImg = null; stripInfo = null; waveData = null;
  const vq = `job=${encodeURIComponent(P.job)}&video=${encodeURIComponent(P.video.url)}`;
  api("/api/strip?" + vq).then(s => { stripInfo = s; const im = new Image(); im.onload = () => { stripImg = im; drawTL(); }; im.src = s.url; }).catch(() => {});
  api("/api/wave?" + vq).then(w => { waveData = w; drawTL(); }).catch(() => {});
  v.addEventListener("loadeddata", () => { seek(S.tease ? S.tease[0] : S.start); }, { once: true });
  refresh(); fitTL();
}

// ================================================================ transcript
function buildUnits() {
  units = []; const ws = P.words;
  for (let i = 0; i < ws.length; i++) {
    if (i && ws[i].s - ws[i - 1].e > 0.8) units.push({ kind: "pause", s: ws[i - 1].e, e: ws[i].s, w: "•" });
    units.push({ kind: "word", s: ws[i].s, e: ws[i].e, w: ws[i].w, wi: i });
  }
  $("#words").innerHTML = units.map((u, k) =>
    (u.kind === "pause" && u.e - u.s > 2.2 ? `<span class="para"></span>` : "") +
    `<span class="u${u.kind === "pause" ? " pause" : ""}" data-k="${k}"${u.kind === "pause" ? ` title="${(u.e - u.s).toFixed(1)} s pause"` : ""}>${esc(u.w)}</span>`).join(" ") || `<div class="empty">No transcript for this part.</div>`;
}
function paintWords() {
  $$("#words .u").forEach(el => {
    const u = units[+el.dataset.k]; const mid = (u.s + u.e) / 2;
    el.classList.toggle("out", u.e <= S.start + 0.02 || u.s >= S.end - 0.02);
    el.classList.toggle("cut", inside(S.drop, Math.max(u.s, mid - 0.05), Math.min(u.e, mid + 0.05)));
    el.classList.toggle("keep", u.kind === "pause" && S.keep.some(([a, b]) => a < u.e && b > u.s));
    el.classList.toggle("hook", !!S.tease && mid >= S.tease[0] && mid <= S.tease[1]);
    el.classList.toggle("sel", !!sel && mid >= sel[0] && mid <= sel[1]);
  });

}
let curEl = null;
function paintCur(t) {
  const k = units.findIndex(u => u.kind === "word" && t >= u.s && t < u.e + 0.05);
  const el = k >= 0 ? $(`#words .u[data-k="${k}"]`) : null;
  if (el === curEl) return;
  curEl?.classList.remove("cur"); curEl = el;
  if (el) { el.classList.add("cur"); if (playing) scrollWordIntoView(el); }
}
function scrollWordIntoView(el) { const box = $("#words"), r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); if (r.top < b.top + 40 || r.bottom > b.bottom - 60) box.scrollTop += r.top - b.top - b.height / 3; }
(function wordEvents() {
  let anchor = null, dragging = false, moved = false;
  const box = $("#words");

    const el = e.target.closest(".u"); if (!el) return; e.preventDefault();

  });

    if (!dragging) return; const el = e.target.closest(".u"); if (!el) return;

  });

    if (!dragging) return; dragging = false;
    if (!moved) { seek(units[anchor].s); if (sel) clearSel(); }
  });

})();
function setSelUnits(i, j) {
  const [a, b] = [Math.min(i, j), Math.max(i, j)];

  paintWords(); drawTL();
}
function clearSel() { sel = null; paintWords(); drawTL(); }
function placeSelbar() {
  const bar = $("#selbar");
  if (!sel || !P) { bar.classList.remove("show"); return; }
  $("#selLen").textContent = `${(sel[1] - sel[0]).toFixed(1)} s`;
  const els = $$("#words .u.sel"); bar.classList.add("show");

let mouse = null, peers = [], remoteRender = null, myAction = null, myActionAt = 0; const myRenders = new Set();

  const n = prompt("Your name on other people's screens", ME.name); if (n && n.trim()) { ME.name = n.trim().slice(0, 20); lsSet("clipeditor:me", { name: ME.name, color: ME.color }); $("#peers")._h = ""; peerAvatars(); }

let inflight = false, agentDone = [];
async function presenceLoop() {
  if (!inflight && P) {
    inflight = true;
    const body = { sid: ME.sid, name: ME.name, color: ME.color, clip: `${P.job}/${P.name}`, known_v: knownV,
      cursor: mouse ? myAnchor(mouse[0], mouse[1]) : null, action: performance.now() - myActionAt < 2500 ? myAction : null,
      ghosts: agentGhost ? [agentGhost.report()] : [], agent_done: agentDone };

// ================================================================ Claude: scripted edits shown with a cursor
let agentQueue = [], agentRunning = false, agentGhost = null;
function ghost(id, name, color) {

  return {

    async toEl(t, fx = 0.5, fy = 0.55, ms) { if (!t) throw new Error("not on screen"); t.scrollIntoView?.({ block: "nearest", inline: "nearest" }); const r = t.getBoundingClientRect(); await this.to(r.left + r.width * fx, r.top + r.height * fy, ms); },

function findText(text) {   // first run of words matching `text` (case and punctuation ignored)
  const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
  const want = norm(text).split(" "); const ws = units.filter(u => u.kind === "word");

async function agentStep(g, st) {

    await g.toEl(e0, 0.05, 0.6); await g.click();

    cropTmp = b; placeBox(); await sleep(400); await g.toEl($("#cropApply")); await g.click(); $("#cropApply").click(); return;
  }
  if (d === "seek") { const r = tl.getBoundingClientRect(); g.say(""); await g.to(r.left + X(+st.t), r.top + SY + SH / 2); await g.click(); seek(+st.t); return; }
